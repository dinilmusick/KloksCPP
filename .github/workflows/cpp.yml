name: KloksCPP portable native release
on:
  push:
    branches: [main, 'feat/**', 'parity/**']
  pull_request:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix installed
      - name: External consumer configure
        run: cmake -S consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/installed
      - name: External consumer build
        run: cmake --build consumer-build --config ${{ matrix.build_type }} --parallel 2
      - name: External consumer run
        shell: bash
        run: |
          if [ "${{ runner.os }}" = 'Windows' ]; then ./consumer-build/Debug/consumer.exe || ./consumer-build/Release/consumer.exe; else ./consumer-build/consumer; fi
  gcc-clang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
